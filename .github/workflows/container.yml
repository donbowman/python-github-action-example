name: Container

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to push, usually the release tag such as v1.2.3.
        required: true
        type: string
      ref:
        description: Git ref to build. Defaults to the triggering commit.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to push. Leave empty to build and scan only.
        required: false
        type: string
      ref:
        description: Git ref to build. Defaults to the triggering commit.
        required: false
        type: string
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - poetry.lock
      - poetry.toml
      - alembic.ini
      - src/**
      - migrations/**
      - .github/workflows/container.yml

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolve image metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          IMAGE_NAME="${GITHUB_REPOSITORY#*/}"
          SOURCE_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${SOURCE_SHA:0:7}"

          if [ -n "$REGISTRY" ]; then
            IMAGE="$REGISTRY/$IMAGE_NAME"
          else
            IMAGE="$IMAGE_NAME"
          fi

          if [ -n "$INPUT_TAG" ]; then
            VERSION="$INPUT_TAG"
            PUSH="true"
          else
            VERSION="sha-$SHORT_SHA"
            PUSH="false"
          fi

          if [ "$PUSH" = "true" ] && [ -z "$REGISTRY" ]; then
            echo "ACR_LOGIN_SERVER is not set but an image tag was supplied." >&2
            exit 1
          fi

          {
            echo "image=$IMAGE"
            echo "version=$VERSION"
            echo "push=$PUSH"
            echo "source_sha=$SOURCE_SHA"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.meta.outputs.source_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          artifact-name: sbom-image.spdx.json
          upload-release-assets: false

      - name: Azure login (OIDC)
        if: steps.meta.outputs.push == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR token
        if: steps.meta.outputs.push == 'true'
        id: acr
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          test -n "$ACR_NAME"
          TOKEN="$(az acr login --name "$ACR_NAME" --expose-token \
            --query accessToken --output tsv)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ steps.acr.outputs.token }}

      - name: Push image
        if: steps.meta.outputs.push == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          docker tag "$IMAGE:$VERSION" "$IMAGE:sha-$SHORT_SHA"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$SHORT_SHA"

          if [[ "$VERSION" == v* ]]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

      - name: Summary
        run: |
          {
            echo "### Container image"
            echo ""
            echo "- Image: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\`"
            echo "- Pushed: \`${{ steps.meta.outputs.push }}\`"
            echo "- Source commit: \`${{ steps.meta.outputs.source_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
