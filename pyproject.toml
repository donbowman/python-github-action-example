[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "python-github-action-example"
version = "0.1.0"
description = "Small FastAPI, SQLAlchemy and Alembic service with a complete GitHub Actions pipeline."
readme = "README.md"
requires-python = ">=3.14,<4.0"
license = "MIT"
authors = [{ name = "Don Bowman", email = "db@donbowman.ca" }]
keywords = ["alembic", "fastapi", "github-actions", "sqlalchemy"]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "alembic>=1.20.0,<2.0.0",
  "fastapi>=0.143.0,<1.0.0",
  "pydantic-settings>=2.16.0,<3.0.0",
  "sqlalchemy>=2.1.0,<3.0.0",
  "uvicorn>=0.54.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/donbowman/python-github-action-example"
Repository = "https://github.com/donbowman/python-github-action-example"

[tool.poetry]
packages = [{ include = "example_app", from = "src" }]

[tool.poetry.group.dev.dependencies]
black = "26.10.1"
flake8 = "7.4.1"
httpx2 = ">=2.13.1,<3.0.0"
pre-commit = "4.7.0"
pytest = "9.1.1"

[tool.poetry.group.release]
optional = true

[tool.poetry.group.release.dependencies]
python-semantic-release = "10.7.0"

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
major_on_zero = false
tag_format = "v{version}"
commit_message = "chore(release): {version} [skip ci]"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false
prerelease_token = "rc"

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false

[tool.semantic_release.remote.token]
env = "GH_TOKEN"
